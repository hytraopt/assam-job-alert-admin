<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Assam Job Alert</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f5; padding: 20px; margin: 0; }
    .form-container { max-width: 450px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #003366; margin-top: 0; }
    label { font-weight: bold; font-size: 14px; color: #333; display: block; margin-top: 10px; }
    input, textarea, button { width: 100%; margin-top: 5px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    textarea { resize: vertical; }
    button { background: #003366; color: white; font-weight: bold; border: none; margin-top: 20px; cursor: pointer; font-size: 16px; }
    button:hover { background: #002244; }
    #msg { text-align: center; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Admin Job Entry</h2>
    
    <label>Admin Secret Password</label>
    <input type="password" id="secretKey" placeholder="Enter password" required>
    <hr style="margin-top: 15px;">

    <label>Job Title</label>
    <input type="text" id="jobTitle" placeholder="e.g. Assam Police Recruitment 2026" required>

    <label>Posting Date</label>
    <input type="date" id="date" required>

    <label>About Job</label>
    <textarea id="aboutJob" rows="3" placeholder="Brief details about the job" required></textarea>

    <label>Requirements</label>
    <textarea id="requirements" rows="3" placeholder="Qualification, age limit, etc." required></textarea>

    <label>Last Date to Apply</label>
    <input type="date" id="lastDate" required>

    <label>Official Apply Link</label>
    <input type="url" id="applyLink" placeholder="https://..." required>

    <button onclick="postJob()">Publish Job Alert</button>

    <p id="msg"></p>
  </div>

  <script>
    // Apne Google Apps Script ka URL yahan paste karein
    const API_URL = "https://script.google.com/macros/s/AKfycbyZnkUKP0lJ5cCN4B968GmvHHigAfMjuxJwGQH1WPqFgCBpYZpfLwWVyiiMuAY0DdoC-g/exec";

    function postJob() {
      const msg = document.getElementById("msg");
      const secretKey = document.getElementById("secretKey").value;

      if (!secretKey) {
        alert("Please enter the secret password!");
        return;
      }

      msg.style.color = "blue";
      msg.innerText = "Posting job alert...";

      const jobData = {
        secretKey: secretKey,
        jobTitle: document.getElementById("jobTitle").value,
        date: document.getElementById("date").value,
        aboutJob: document.getElementById("aboutJob").value,
        requirements: document.getElementById("requirements").value,
        lastDate: document.getElementById("lastDate").value,
        applyLink: document.getElementById("applyLink").value
      };

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(jobData)
      })
      .then(res => res.json())
      .then(res => {
        if(res.status === "Success") {
          msg.style.color = "green";
          msg.innerText = "Job successfully posted!";
          document.querySelectorAll("input:not(#secretKey), textarea").forEach(input => input.value = "");
        } else {
          msg.style.color = "red";
          msg.innerText = "Unauthorized / Wrong Password!";
        }
      })
      .catch(err => {
        msg.style.color = "red";
        msg.innerText = "Error posting job. Try again.";
        console.error(err);
      });
    }
  </script>

</body>
</html>
