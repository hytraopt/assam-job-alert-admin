<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Job Management</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; max-width: 800px; margin: auto; }
    .box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, textarea, button { width: 100%; margin-top: 8px; padding: 10px; box-sizing: border-box; }
    button { background: #003366; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
    .btn-danger { background: #d9534f; margin-top: 5px; }
    .btn-edit { background: #f0ad4e; margin-top: 5px; }
    .job-item { border-bottom: 1px solid #ccc; padding: 10px 0; }
  </style>
</head>
<body>

  <div class="box">
    <h2 id="form-title">Add New Job Alert</h2>
    <label>Secret Password</label>
    <input type="password" id="secretKey" placeholder="Password" required>
    
    <input type="hidden" id="rowIndex">
    <input type="text" id="jobTitle" placeholder="Job Title">
    <input type="date" id="date">
    <textarea id="aboutJob" placeholder="About Job"></textarea>
    <textarea id="requirements" placeholder="Requirements"></textarea>
    <input type="date" id="lastDate">
    <input type="url" id="applyLink" placeholder="Apply Link">
    
    <button id="submitBtn" onclick="saveJob()">Publish Job</button>
    <p id="msg" style="font-weight: bold; margin-top: 10px;"></p>
  </div>

  <div class="box">
    <h2>Manage Posted Jobs</h2>
    <div id="job-list">Loading jobs...</div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyZnkUKP0lJ5cCN4B968GmvHHigAfMjuxJwGQH1WPqFgCBpYZpfLwWVyiiMuAY0DdoC-g/exec"; // Web App URL Replace Karein

    function loadJobs() {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById("job-list");
          list.innerHTML = "";
          data.forEach(job => {
            const item = document.createElement("div");
            item.className = "job-item";
            item.innerHTML = `
              <strong>${job["Job Title"]}</strong> (${job["Date"]})
              <button class="btn-edit" onclick='editSetup(${JSON.stringify(job)})'>Edit</button>
              <button class="btn-danger" onclick="deleteJob(${job.rowIndex})">Delete</button>
            `;
            list.appendChild(item);
          });
        });
    }

    function saveJob() {
      const secretKey = document.getElementById("secretKey").value;
      const rowIndex = document.getElementById("rowIndex").value;
      const action = rowIndex ? "edit" : "add";

      const params = new URLSearchParams({
        action: action,
        secretKey: secretKey,
        rowIndex: rowIndex || "",
        jobTitle: document.getElementById("jobTitle").value,
        date: document.getElementById("date").value,
        aboutJob: document.getElementById("aboutJob").value,
        requirements: document.getElementById("requirements").value,
        lastDate: document.getElementById("lastDate").value,
        applyLink: document.getElementById("applyLink").value
      });

      document.getElementById("msg").style.color = "blue";
      document.getElementById("msg").innerText = "Processing...";

      fetch(`${API_URL}?${params.toString()}`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "Success") {
            document.getElementById("msg").style.color = "green";
            document.getElementById("msg").innerText = res.message;
            resetForm();
            loadJobs();
          } else {
            document.getElementById("msg").style.color = "red";
            document.getElementById("msg").innerText = res.message || "Error Occurred";
          }
        })
        .catch(err => {
          document.getElementById("msg").style.color = "red";
          document.getElementById("msg").innerText = "Network Error!";
        });
    }

    function deleteJob(rowIndex) {
      const secretKey = prompt("Confirm Delete - Enter Secret Password:");
      if (!secretKey) return;

      const params = new URLSearchParams({
        action: "delete",
        secretKey: secretKey,
        rowIndex: rowIndex
      });

      fetch(`${API_URL}?${params.toString()}`)
        .then(res => res.json())
        .then(res => {
          alert(res.message);
          loadJobs();
        });
    }

    function editSetup(job) {
      document.getElementById("form-title").innerText = "Edit Job Alert";
      document.getElementById("rowIndex").value = job.rowIndex;
      document.getElementById("jobTitle").value = job["Job Title"];
      document.getElementById("date").value = job["Date"];
      document.getElementById("aboutJob").value = job["About Job"];
      document.getElementById("requirements").value = job["Requirements"];
      document.getElementById("lastDate").value = job["Last Date"];
      document.getElementById("applyLink").value = job["Apply Link"];
      document.getElementById("submitBtn").innerText = "Update Job";
    }

    function resetForm() {
      document.getElementById("form-title").innerText = "Add New Job Alert";
      document.getElementById("rowIndex").value = "";
      document.querySelectorAll("input:not(#secretKey), textarea").forEach(i => i.value = "");
      document.getElementById("submitBtn").innerText = "Publish Job";
    }

    loadJobs();
  </script>
</body>
</html>
