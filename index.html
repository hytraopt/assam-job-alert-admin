<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Assam Job Alert</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f5; padding: 20px; }
    .form-box { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input, textarea, button { width: 100%; margin-top: 5px; padding: 10px; box-sizing: border-box; }
    button { background: #003366; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Add Job Alert</h2>
    <label>Admin Secret Password</label>
    <input type="password" id="secretKey" placeholder="Password" required>
    <hr>
    <label>Job Title</label>
    <input type="text" id="jobTitle" placeholder="Job Title" required>
    <label>Posting Date</label>
    <input type="date" id="date" required>
    <label>About Job</label>
    <textarea id="aboutJob" placeholder="Details" required></textarea>
    <label>Requirements</label>
    <textarea id="requirements" placeholder="Eligibility" required></textarea>
    <label>Last Date</label>
    <input type="date" id="lastDate" required>
    <label>Apply Link</label>
    <input type="url" id="applyLink" placeholder="https://..." required>
    
    <button onclick="postJob()">Publish Job</button>
    <p id="msg"></p>
  </div>

  <script>
    // Iss string ki jagah apna Google Web App URL paste karein
    const API_URL = "https://script.google.com/macros/s/AKfycbyZnkUKP0lJ5cCN4B968GmvHHigAfMjuxJwGQH1WPqFgCBpYZpfLwWVyiiMuAY0DdoC-g/exec";

    function postJob() {
      const msg = document.getElementById("msg");
      msg.innerText = "Posting job...";

      const jobData = {
        secretKey: document.getElementById("secretKey").value,
        jobTitle: document.getElementById("jobTitle").value,
        date: document.getElementById("date").value,
        aboutJob: document.getElementById("aboutJob").value,
        requirements: document.getElementById("requirements").value,
        lastDate: document.getElementById("lastDate").value,
        applyLink: document.getElementById("applyLink").value
      };

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(jobData)
      })
      .then(res => res.json())
      .then(res => {
        if(res.status === "Success") {
          msg.style.color = "green";
          msg.innerText = "Job successfully posted!";
          document.querySelectorAll("input:not(#secretKey), textarea").forEach(i => i.value = "");
        } else {
          msg.style.color = "red";
          msg.innerText = "Wrong Password!";
        }
      });
    }
  </script>
</body>
</html>
